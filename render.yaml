# render.yaml — IronPulse Backend Render Blueprint
# Deploy at: https://dashboard.render.com/select-repo
# Render reads this file automatically when you connect this repo.

services:
  - type: web
    name: ironpulse-backend
    env: node
    region: oregon               # free-tier region
    plan: free
    rootDir: ironpulse-backend   # subfolder inside the repo
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000             # Render default port for Node services

      # --- Database ---
      # Paste the Neon (or Render Postgres) connection string here after setup.
      # Format: postgresql://user:password@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false              # You enter this manually in the Render dashboard

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true      # Render auto-generates a secure random secret

      - key: JWT_EXPIRES_IN
        value: 7d

      # --- CORS ---
      - key: FRONTEND_URL
        value: https://sem-proj-ironpulse.vercel.app
